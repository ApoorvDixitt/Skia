[package]
name = "skia"
version = "0.1.0"
description = "A local-first meeting copilot: live transcription, notes, and answers grounded in your own documents."
authors = ["Apoorv Dixit"]
license = "Apache-2.0"
repository = "https://github.com/ApoorvDixitt/Skia"
edition = "2021"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "skia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
os_info = "3"

# Model providers. rustls rather than native-tls so the TLS stack is identical
# on macOS and Windows and needs no system OpenSSL.
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "stream",
  "http2",
  "charset",
  "rustls",
  "webpki-roots",
] }
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }

# API keys live in the OS keychain, never in a config file or log.
keyring = "4"

# Content hashing for incremental re-indexing of knowledge-base files.
sha2 = "0.10"
cpal = "0.18.2"
rubato = "5.0.0"

# Deliberately NOT depending on objc2 or the windows crate. Tauri already
# implements capture protection natively -- set_content_protected maps to
# NSWindow.sharingType = .none on macOS and SetWindowDisplayAffinity with
# WDA_EXCLUDEFROMCAPTURE on Windows, which are exactly the mechanisms measured
# in tools/macos-capture-harness. Hand-rolling that would add unsafe code for
# no benefit.

