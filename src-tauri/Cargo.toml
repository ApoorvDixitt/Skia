[package]
name = "skia"
version = "0.1.0"
description = "A local-first meeting copilot: live transcription, notes, and answers grounded in your own documents."
authors = ["Apoorv Dixit"]
license = "Apache-2.0"
repository = "https://github.com/ApoorvDixitt/Skia"
edition = "2021"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "skia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
os_info = "3"

# Deliberately NOT depending on objc2 or the windows crate. Tauri already
# implements capture protection natively -- set_content_protected maps to
# NSWindow.sharingType = .none on macOS and SetWindowDisplayAffinity with
# WDA_EXCLUDEFROMCAPTURE on Windows, which are exactly the mechanisms measured
# in tools/macos-capture-harness. Hand-rolling that would add unsafe code for
# no benefit.

