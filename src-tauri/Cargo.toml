[package]
name = "skia"
version = "0.1.0"
description = "A local-first meeting copilot: live transcription, notes, and answers grounded in your own documents."
authors = ["Apoorv Dixit"]
license = "Apache-2.0"
repository = "https://github.com/ApoorvDixitt/Skia"
edition = "2021"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "skia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
os_info = "3"

# Model providers. rustls rather than native-tls so the TLS stack is identical
# on macOS and Windows and needs no system OpenSSL.
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "stream",
  "http2",
  "charset",
  "rustls",
  "webpki-roots",
] }
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }

# API keys live in the OS keychain, never in a config file or log.
keyring = "4"

# Content hashing for incremental re-indexing of knowledge-base files.
sha2 = "0.10"

# Audio capture: microphone via cpal, resampled to the 16 kHz mono every
# transcription backend expects.
cpal = "0.18.2"
rubato = "5.0.0"

# Document parsers for the knowledge base. PDF text extraction is the one
# problem in this codebase genuinely too big to hand-roll (fonts, encodings,
# content streams), so it gets a dependency. DOCX does not: a .docx is a zip
# holding XML, and the ~hundred lines in rag/parse.rs that read paragraph text
# out of word/document.xml beat a full OOXML crate nobody has vetted. deflate
# is the only zip feature needed — DOCX writers use nothing else.
pdf-extract = "0.12.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
quick-xml = "0.41.0"

# For capture *protection*, still deliberately NOT hand-rolling native code:
# Tauri's set_content_protected maps to NSWindow.sharingType = .none on macOS
# and SetWindowDisplayAffinity(WDA_EXCLUDEFROMCAPTURE) on Windows, exactly the
# mechanisms measured in tools/macos-capture-harness.
#
# objc2 earns its place for one thing that has no safe wrapper: microphone
# consent. cpal reaches the mic through the CoreAudio HAL, which never shows
# the permission dialog on its own -- macOS delivers silence until
# AVCaptureDevice.requestAccess is called (measured: a shipped build recorded
# five seconds of exact zeros, prompt-free). See src/audio/consent.rs, the
# crate's only unsafe code.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-av-foundation = { version = "0.3.2", default-features = false, features = [
  "AVCaptureDevice",
  "AVMediaFormat",
  "block2",
  "std",
] }

