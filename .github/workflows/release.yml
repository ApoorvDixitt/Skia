name: Release

on:
  push:
    tags: ["v*"]

# Default to no permissions; the build job opts in to what it needs.
permissions: {}

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write # create the release and upload installers to it
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            runner: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - name: Windows (x64)
            runner: windows-latest
            rust-targets: ""
            args: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          target: ${{ matrix.rust-targets }}
          cache-workspaces: src-tauri
          rustflags: ""

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required once tauri-plugin-updater is wired up and uploadUpdaterJson
          # is switched on. See docs/RELEASING.md.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Skia ${{ github.ref_name }}
          # Published by hand after checking the installers actually launch.
          releaseDraft: true
          prerelease: true
          generateReleaseNotes: true
          # Turn on with the updater plugin; until then there is nothing to sign
          # and an updater manifest would point at an app that cannot self-update.
          uploadUpdaterJson: false
          args: ${{ matrix.args }}
