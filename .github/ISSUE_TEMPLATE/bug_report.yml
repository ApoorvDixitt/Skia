name: Bug report
description: Report something that isn't working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Skia is pre-alpha — please check the [roadmap](https://github.com/ApoorvDixitt/Skia/blob/main/docs/ROADMAP.md)
        first, since most features aren't built yet. Unbuilt features aren't bugs.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected, what actually happened, and the steps to reproduce it.
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS 15 or later
        - macOS 14 or earlier
        - Windows 11
        - Windows 10
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: Exact OS version
      description: "For example: macOS 26.5, or Windows 11 24H2. Much of Skia's behaviour is version-dependent."
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Skia version or commit
      description: A release tag, or the commit SHA if you built from source.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or errors
      description: Paste any relevant output. Please remove API keys first.
      render: shell
    validations:
      required: false
